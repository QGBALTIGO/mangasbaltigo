name: Import AniNexus once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-aninexus-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-aninexus-once
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'QGBALTIGO/mangasbaltigo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Import pinned AniNexus snapshot and history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 939584b68ca5ef4809037bfc62bd5c0a28ee6ba0
          SOURCE_TREE: b633a8f21ac670a7a0386a1a0008f7fd41366310
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git init --initial-branch=main import-workspace
          cd import-workspace
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch --no-tags origin main
          DEST_HEAD="$(git rev-parse FETCH_HEAD)"
          test "$DEST_HEAD" = "$GITHUB_SHA" || { echo 'Destination changed; refusing to overwrite concurrent work.'; exit 1; }
          git fetch --no-tags https://github.com/QGBALTIGO/AniNexus.git "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          SOURCE_GITHUB="$(git rev-parse "$SOURCE_SHA:.github")"
          BOOTSTRAP_GITHUB="$(git rev-parse "$DEST_HEAD:.github")"
          if git cat-file -e "$SOURCE_SHA:.aninexus-import-github" 2>/dev/null; then
            echo 'Temporary import path already exists in source; stopping.'
            exit 1
          fi
          # Keep imported workflows inactive until the final verified tree is published.
          # The original source commit is also a parent, preserving its complete history.
          git read-tree "$SOURCE_SHA"
          git rm -r --cached --ignore-unmatch .github
          git read-tree --prefix=.github/ "$BOOTSTRAP_GITHUB"
          git read-tree --prefix=.aninexus-import-github/ "$SOURCE_GITHUB"
          IMPORT_TREE="$(git write-tree)"
          IMPORT_COMMIT="$(printf 'chore: importar AniNexus com historico completo [skip ci]\n\nSource: QGBALTIGO/AniNexus@%s\nTemporary workflow staging will be removed when publishing the exact source tree.\n' "$SOURCE_SHA" | git commit-tree "$IMPORT_TREE" -p "$DEST_HEAD" -p "$SOURCE_SHA")"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$IMPORT_COMMIT:refs/heads/main"
          {
            echo '## AniNexus import transferred'
            echo "Source commit: $SOURCE_SHA"
            echo "Source tree: $SOURCE_TREE"
            echo "Import commit: $IMPORT_COMMIT"
            echo "Tracked source files: $(git ls-tree -r --name-only "$SOURCE_SHA" | wc -l)"
            echo "Source history commits: $(git rev-list --count "$SOURCE_SHA")"
            echo 'Finalization: publish the exact source tree and remove temporary import files.'
          } >> "$GITHUB_STEP_SUMMARY"
