name: Mangás Baltigo quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-media-list
          POSTGRES_DB: aninexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Syntax, news, core and smoke contracts
        run: pnpm run check
      - name: Media list migration and database persistence
        env:
          MEDIA_TEST_DATABASE_URL: postgres://postgres:ci-media-list@127.0.0.1:5432/aninexus_test
        run: node tests/media-list-database.mjs
      - name: Validate production frontend assembly
        run: |
          pnpm run build:public
          pnpm run validate:deploy
      - name: High-severity dependency audit
        run: pnpm audit --prod --audit-level high --ignore-registry-errors
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose model
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production-1234567890
          REDIS_PASSWORD: ci-only-redis-password-not-for-production-1234567890
          IP_HASH_SALT: ci-only-ip-salt-not-for-production-1234567890
          PUBLIC_ORIGIN: https://example.invalid
        run: docker compose config --quiet
      - name: Validate safe load-test entrypoints
        shell: bash
        run: |
          node --check scripts/load/local-smoke.mjs
          node --check scripts/load/staging-ramp.k6.js
          node scripts/load/local-smoke.mjs --dry-run
          if LOAD_TARGET=https://aninexus.com.br node scripts/load/local-smoke.mjs --dry-run; then
            echo 'The load runner accepted production unexpectedly.' >&2
            exit 1
          fi
      - name: Validate Nginx configuration
        run: |
          cp nginx.conf /tmp/aninexus-nginx.conf
          sed -i 's/server app:3000;/server 127.0.0.1:3000;/' /tmp/aninexus-nginx.conf
          docker run --rm \
            -v /tmp/aninexus-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            -v "$PWD/ops/nginx/aninexus-bootstrap.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          mkdir -p /tmp/aninexus-cert/live/187.77.255.164
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=187.77.255.164' \
            -keyout /tmp/aninexus-cert/live/187.77.255.164/privkey.pem \
            -out /tmp/aninexus-cert/live/187.77.255.164/fullchain.pem >/dev/null 2>&1
          mkdir -p /tmp/aninexus-cert/live/aninexus.com.br
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=aninexus.com.br' \
            -keyout /tmp/aninexus-cert/live/aninexus.com.br/privkey.pem \
            -out /tmp/aninexus-cert/live/aninexus.com.br/fullchain.pem >/dev/null 2>&1
          docker run --rm \
            -v "$PWD/ops/nginx/aninexus.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v /tmp/aninexus-cert:/etc/letsencrypt:ro \
            nginx:1.27-alpine nginx -t
          for script in ops/install-ip-tls.sh ops/install-domain-tls.sh ops/deploy-vps.sh ops/deploy-api-vps.sh; do
            [ ! -f "$script" ] || bash -n "$script"
          done
      - name: Build real production image
        run: docker build --pull -t aninexus-ci:${{ github.sha }} .
      - name: Verify Mangás Baltigo production image
        run: |
          CID=$(docker create aninexus-ci:${{ github.sha }})
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/app/public/index.html" /tmp/mangas-baltigo-index.html
          grep -q 'mangas-baltigo-v62' /tmp/mangas-baltigo-index.html
          grep -q 'Mangás Baltigo' /tmp/mangas-baltigo-index.html
          grep -q 'preview-v42/mangas-baltigo-v62.css' /tmp/mangas-baltigo-index.html
          grep -q 'preview-v42/mangas-baltigo-v62.js' /tmp/mangas-baltigo-index.html
          for FILE in preview-v42/mangas-baltigo-v62.css preview-v42/mangas-baltigo-v62.js; do
            OUT="/tmp/$(basename "$FILE")"
            docker cp "$CID:/app/public/$FILE" "$OUT"
            test -s "$OUT"
          done

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser test runner
        run: |
          while IFS= read -r SOURCE_FILE; do
            sudo mv "$SOURCE_FILE" "/tmp/$(basename "$SOURCE_FILE").disabled"
          done < <(grep -rl 'dl.google.com/linux/chrome-stable' /etc/apt/sources.list.d || true)
          pnpm exec playwright install --with-deps "${{ matrix.project }}"
      - name: Map GitHub Pages hostname locally
        run: echo "127.0.0.1 qgbaltigo.github.io" | sudo tee -a /etc/hosts
      - name: Mangás Baltigo browser E2E
        env:
          MANGAS_BALTIGO_E2E_ORIGIN: http://qgbaltigo.github.io:4173/mangasbaltigo/
        run: |
          rm -rf /tmp/mangas-baltigo-e2e-root
          mkdir -p /tmp/mangas-baltigo-e2e-root/mangasbaltigo
          rsync -a --exclude '.git' --exclude 'node_modules' ./ /tmp/mangas-baltigo-e2e-root/mangasbaltigo/
          sed -i 's/; upgrade-insecure-requests//' /tmp/mangas-baltigo-e2e-root/mangasbaltigo/index.html
          (cd /tmp/mangas-baltigo-e2e-root && python3 -m http.server 4173 > /tmp/mangas-baltigo-http.log 2>&1) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --noproxy '*' -fsS http://qgbaltigo.github.io:4173/mangasbaltigo/ >/dev/null; then break; fi
            if [ "$i" = "20" ]; then cat /tmp/mangas-baltigo-http.log; exit 1; fi
            sleep 1
          done
          pnpm exec playwright test tests/mangas-baltigo.spec.mjs --project="${{ matrix.project }}" --reporter=line --timeout=60000 --retries=1
      - name: Show static server log on failure
        if: failure()
        run: cat /tmp/mangas-baltigo-http.log || true
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mangas-baltigo-browser-failure-${{ matrix.project }}
          path: test-results/
          retention-days: 3
