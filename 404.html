<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07090c">
<title>Redirecionando | Mangás Baltigo</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#07090c;color:#fff;font-family:system-ui,sans-serif">
<main style="max-width:520px;text-align:center">
<h1>Encontrando essa página…</h1>
<p style="color:#9aa7b3;line-height:1.6">Você será levado à rota correta do Mangás Baltigo.</p>
<a href="/mangasbaltigo/" style="display:inline-flex;min-height:44px;align-items:center;padding:0 18px;border-radius:12px;background:#22c8f6;color:#041116;text-decoration:none;font-weight:800">Ir para o início</a>
</main>
<script>
!function(){
  var base='/mangasbaltigo';
  var path=location.pathname.startsWith(base)?location.pathname.slice(base.length):location.pathname;
  path=path||'/';
  location.replace(base+'/?p='+encodeURIComponent(path+(location.search||'')+(location.hash||'')));
}();
</script>
</body>
</html>
